<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GigHz LMS Login</title>

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="ForgotPassword.css">

    <script src="jquery.js"></script>
    <script src="common.js"></script>
    <script src="ForgotPassword.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="forgot-container">
        <form class="forgot-form">
            <h2>Password Recovery</h2>
            <p>Please enter your email address and username to receive a password reset link, or view the password hint.</p>
            <input type="email" class="email" placeholder="Email Address" required />
            <input type="text" class="username" placeholder="Username" required />
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="option" value="hint" checked/>
                    Password hint
                </label>
                <label class="radio-option">
                    <input type="radio" name="option" value="mail" />
                    Password reset email
                </label>
            </div>
            <button type="submit">Submit</button>
            <div class="back-login">
                <a href="login.html">← Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
